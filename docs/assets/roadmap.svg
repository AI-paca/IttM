<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="590" viewBox="0 0 1900 590" role="img" aria-labelledby="title desc">
  <title id="title">IttM development roadmap</title>
  <desc id="desc">One project swimlane. Commit anchors run from the MVP to the current tree. Solid red through green blocks show maturity layers. Green hatching is unfinished current work and blue hatching is future work.</desc>
  <defs>
    <pattern id="green-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M 0 0 L 0 6" stroke="#95c981" stroke-width="2.2" opacity=".92"/>
    </pattern>
    <pattern id="blue-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M 0 0 L 0 6" stroke="#7db8e8" stroke-width="2.2" opacity=".92"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #d7dde5; }
    .title { font-size: 20px; font-weight: 760; text-anchor: middle; }
    .axis { font-size: 8.7px; font-weight: 680; fill: #adb7c3; text-anchor: middle; }
    .axis-note { font-size: 7.6px; font-weight: 760; fill: #d3dae3; text-anchor: middle; }
    .lane { font-size: 11px; font-weight: 760; fill: #edf2f7; }
    .band-a { fill: #303229; opacity: .92; }
    .band-b { fill: #20262d; opacity: .92; }
    .future-bg { fill: #233846; opacity: .24; }
    .tick { stroke: #d8dee6; stroke-width: .7; opacity: .5; }
    .now { stroke: #ff4d4d; stroke-width: 2; opacity: .94; }
    .boundary { stroke: #7db8e8; stroke-width: 1.7; stroke-dasharray: 6 5; opacity: .95; }
    .seg { rx: 10; ry: 10; stroke: #151a20; stroke-width: .7; }
    .p0 { fill: #da7e76; }
    .p1 { fill: #dc9a70; }
    .p2 { fill: #d9bd70; }
    .p3 { fill: #c7cf76; }
    .p4 { fill: #95c981; }
    .current { fill: url(#green-hatch); stroke: #95c981; stroke-width: 1.35; stroke-dasharray: 5 4; }
    .future { fill: url(#blue-hatch); stroke: #7db8e8; stroke-width: 1.35; stroke-dasharray: 5 4; }
    .label { font-size: 8.2px; font-weight: 780; fill: #20242a; text-anchor: middle; dominant-baseline: central; }
    .small { font-size: 7.4px; }
    .light { fill: #e9f0f7; }
    .legend { font-size: 9.5px; font-weight: 650; fill: #aeb8c4; }
  </style>

  <rect width="1900" height="590" fill="#151a20"/>
  <text x="950" y="25" class="title">IttM — development by responsibility and commit anchor</text>

