name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # These jobs use CPU and browser WASM inference; CUDA binaries are unnecessary.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Semgrep SAST
        run: npm run test:sast

      - name: Upload Semgrep SAST artifacts
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-sast
          path: |
            .sast/semgrep.json
            .sast/semgrep.sarif
          if-no-files-found: warn

  node-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up shared Rust core toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npx eslint .

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Pipeline documentation contract
        run: npm run test:pipeline-docs

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Prepare browser reviewer model
        run: npm run model:browser-reviewer

      - name: GitHub Pages OCR asset regression
        run: npm run build:pages && npm run test:pages

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build OCR test image
        run: docker build -f docker/ocr.Dockerfile --target test --build-arg PYTHON_REQUIREMENTS=requirements-ci.txt --build-arg OCR_INSTALL_CJK_FONTS=1 -t ittm-ocr-ci .

      - name: Contract tests
        env:
          OCR_TEST_IMAGE: ittm-ocr-ci
        run: npm run test:contract

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build OCR test image
        run: docker build -f docker/ocr.Dockerfile --target test --build-arg PYTHON_REQUIREMENTS=requirements-ci.txt --build-arg OCR_INSTALL_CJK_FONTS=1 -t ittm-ocr-ci .

      - name: Smoke tests
        env:
          OCR_TEST_IMAGE: ittm-ocr-ci
        run: npm run test:smoke

  python-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build OCR test image
        run: docker build -f docker/ocr.Dockerfile --target test --build-arg PYTHON_REQUIREMENTS=requirements-ci.txt --build-arg OCR_INSTALL_CJK_FONTS=1 -t ittm-ocr-ci .

      - name: Python style checks
        run: |
          docker run --rm ittm-ocr-ci python -m flake8 .
          docker run --rm ittm-ocr-ci python -m black --check .
          docker run --rm ittm-ocr-ci python -m ruff check .

      - name: Python API, engine, and layout tests
        run: |
          docker run --rm \
            -v "${PWD}/scripts:/scripts:ro" \
            -v "${PWD}/debug:/debug:ro" \
            -v "${PWD}/LLM-OCR:/LLM-OCR:ro" \
            ittm-ocr-ci \
            python -m pytest tests/api tests/engines tests/layout tests/pipeline tests/debug -q

  compose-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate Docker Compose config
        run: docker compose config --quiet
