name: SCA and SBOM

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # SCA consumes the lockfile/package graph and builds production images
        # separately. Native package postinstalls (for example ONNX Runtime)
        # only add an unrelated external binary download and make this gate
        # dependent on that CDN being reachable.
        run: npm ci --ignore-scripts

      - name: Scan source and production images
        run: npm run test:sca

      - name: Upload vulnerability reports and SBOMs
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v6
        with:
          name: sca-sbom-${{ github.run_id }}
          path: |
            .sca/*.json
            .sca/*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
