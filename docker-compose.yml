name: ittm

services:
  ocr:
    image: ittm-ocr
    build:
      context: .
      dockerfile: docker/ocr-native.Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      target: ${OCR_BUILD_TARGET:-runtime}
      args:
        OCR_INSTALL_CJK_FONTS: ${OCR_INSTALL_CJK_FONTS:-0}
    environment:
      PORT: ${OCR_INTERNAL_PORT:-8000}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
    expose:
      - "${OCR_INTERNAL_PORT:-8000}"
    command: ["ittm-ocr", "serve"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 3 "http://127.0.0.1:$${PORT:-8000}/readiness"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    image: ittm-gateway
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    expose:
      - "${GATEWAY_INTERNAL_PORT:-3000}"
    environment:
      PORT: ${GATEWAY_INTERNAL_PORT:-3000}
      OCR_URL: http://ocr:${OCR_INTERNAL_PORT:-8000}
    depends_on:
      ocr:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: ittm-nginx
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    environment:
      NGINX_LISTEN_PORT: ${NGINX_INTERNAL_PORT:-80}
      GATEWAY_HOSTNAME: gateway
      GATEWAY_INTERNAL_PORT: ${GATEWAY_INTERNAL_PORT:-3000}
    ports:
      - "${GATEWAY_HOST_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-3000-3099}:${NGINX_INTERNAL_PORT:-80}"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null "http://127.0.0.1:$${NGINX_LISTEN_PORT:-80}/api/health"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
