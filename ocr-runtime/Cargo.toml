[package]
name = "ittm-ocr-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "ittm-ocr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
ittm-pipeline-core = { path = "../pipeline-core" }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

