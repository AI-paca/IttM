name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Find eligible Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/pulls" \
              --jq 'map(select(.user.login == "dependabot[bot]" and .state == "open")) | first'
          )"

          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$(jq -r '.number' <<<"$pr_json")"
          pr="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json url,headRefOid,baseRefName,isCrossRepository)"

          # The head may have changed while the previous Tests run completed.
          # Never merge an untested update or execute code from the PR here.
          if [ "$(jq -r '.headRefOid' <<<"$pr")" != "$TESTED_SHA" ] ||
             [ "$(jq -r '.baseRefName' <<<"$pr")" != "main" ] ||
             [ "$(jq -r '.isCrossRepository' <<<"$pr")" != "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url' <<<"$pr")" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.url }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge --auto --squash --match-head-commit "$TESTED_SHA" "$PR_URL"
