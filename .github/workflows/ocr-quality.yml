name: OCR quality tests

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  browser-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare Tesseract.js cache directory
        run: mkdir -p .cache/tesseract-js

      - name: Cache Tesseract.js data
        uses: actions/cache@v5
        with:
          path: .cache/tesseract-js
          key: tesseract-js-${{ runner.os }}-eng-rus-chi-sim-v2

      - name: Install npm dependencies
        run: npm ci

      - name: Install browser OCR languages and fixture fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            python3-pil \
            tesseract-ocr \
            tesseract-ocr-chi-sim \
            tesseract-ocr-eng \
            tesseract-ocr-rus

      - name: Browser OCR strict multilingual test
        run: |
          set -euo pipefail
          npm run model:browser-tessdata
          npm run test:ocr:browser

  backend-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Build OCR test image
        run: docker build -f docker/ocr.Dockerfile --target test --build-arg PYTHON_REQUIREMENTS=requirements-ci.txt --build-arg OCR_INSTALL_CJK_FONTS=1 -t ittm-ocr-ci .

      - name: Backend OCR strict multilingual test
        env:
          RUN_OCR_QUALITY: "1"
        run: |
          docker run --rm \
            -e RUN_OCR_QUALITY="${RUN_OCR_QUALITY}" \
            ittm-ocr-ci \
            python -m pytest tests/quality/test_ocr_quality.py -q
